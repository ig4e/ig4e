name: Generate Stats SVG

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual run

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install PyGithub cryptography

      - name: Fetch previous cache from stats branch
        continue-on-error: true
        run: |
          git fetch origin stats
          git checkout origin/stats -- stats_cache.enc
          mkdir -p stats_output
          mv stats_cache.enc stats_output/stats_cache.enc

      - name: Generate SVG
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }} 
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: python generate_stats_svg.py

      - name: Deploy to stats branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stats_output
          publish_branch: stats
          force_orphan: false
          commit_message: "Update stats and encrypted cache"
