name: Generate Stats SVG

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual run

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.21'
          cache: true

      - name: Fetch previous cache from stats branch
        continue-on-error: true
        run: |
          git fetch origin stats
          git checkout origin/stats -- stats_cache.enc || true
          mkdir -p stats_output
          if [ -f stats_cache.enc ]; then
            mv stats_cache.enc stats_output/stats_cache.enc
            echo "Successfully restored cache from stats branch."
          else
            echo "No existing cache found. A full backfill will be performed."
          fi

      - name: Generate Stat SVGs
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }} 
          CACHE_ENCRYPTION_KEY: ${{ secrets.CACHE_ENCRYPTION_KEY }}
        run: |
          go mod download
          go run main.go

      - name: Deploy to stats branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stats_output
          publish_branch: stats
          force_orphan: false
          commit_message: "Update stats and encrypted cache"
