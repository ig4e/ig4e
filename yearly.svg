    .lang-label { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .lang-value { font: 700 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fff; opacity: 0.9; }
    .bento { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
  </style>
  
  <rect width="450" height="340" rx="12" fill="#0d1117" />
  <rect x="15" y="15" width="420" height="310" rx="8" class="bento" />

  
  <text x="35" y="50" class="header">Yearly Stats</text>

  
