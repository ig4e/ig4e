
<svg width="450" height="300" viewBox="0 0 450 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 700 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58a6ff; }
    .stat-label { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; opacity: 0.8; }
    .stat-value { font: 700 22px 'Segoe UI', Ubuntu, Sans-Serif; fill: #fff; }
    .lang-label { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .bento { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
  </style>
  
  <rect width="450" height="300" rx="12" fill="#0d1117" />
  <rect x="15" y="15" width="420" height="270" rx="8" class="bento" />

  
  <text x="35" y="50" class="header">Lifetime Stats</text>

  
  <g transform="translate(35, 75)">
    
    <text x="0" y="0" class="stat-label">Commits</text>
    <text x="0" y="25" class="stat-value">1028</text>
    
    <text x="200" y="0" class="stat-label">Pull Requests</text>
    <text x="200" y="25" class="stat-value">16</text>
    
    
    <text x="0" y="60" class="stat-label">Issues / Reviews</text>
    <text x="0" y="85" class="stat-value">1 / 0</text>
    
    <text x="200" y="60" class="stat-label">Lines Added</text>
    <text x="200" y="85" class="stat-value">67586</text>

    
    <text x="210" y="115" class="stat-label" style="text-anchor: middle;">Total Stars: 11</text>
  </g>

  
  <g transform="translate(35, 200)">
    <text x="0" y="0" class="stat-label">Top Languages</text>
    <rect x="0" y="15" width="380" height="8" rx="4" fill="#333" />
    <g transform="translate(0, 15)">
      
        <rect x="0" y="0" width="320.9351968028634" height="8" fill="#3178c6" rx="4" />
      
        <rect x="320.9351968028634" y="0" width="23.555329078991065" height="8" fill="#e34c26"  />
      
        <rect x="344.49052588185447" y="0" width="21.617120646755996" height="8" fill="#f1e05a"  />
      
        <rect x="366.1076465286105" y="0" width="8.404518589163697" height="8" fill="#fcb32c"  />
      
        <rect x="374.51216511777415" y="0" width="1.978489997497125" height="8" fill="#663399"  />
      
    </g>
    
    
    <g transform="translate(0, 40)">
      
        
        <circle cx="0" cy="0" r="4" fill="#3178c6" />
        <text x="10" y="4" class="lang-label">TypeScript</text>
        
      
        
        <circle cx="80" cy="0" r="4" fill="#e34c26" />
        <text x="90" y="4" class="lang-label">HTML</text>
        
      
        
        <circle cx="160" cy="0" r="4" fill="#f1e05a" />
        <text x="170" y="4" class="lang-label">JavaScript</text>
        
      
        
        <circle cx="240" cy="0" r="4" fill="#fcb32c" />
        <text x="250" y="4" class="lang-label">MDX</text>
        
      
        
        <circle cx="320" cy="0" r="4" fill="#663399" />
        <text x="330" y="4" class="lang-label">CSS</text>
        
      
    </g>
  </g>
</svg>
